<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>سمراء كافيه</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --gold: #AB7D2F;
      --text: #4a4a4a;
      --bg: #ffffff;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      color: var(--text);
      font-family: "Tajawal", "Segoe UI", Tahoma, sans-serif;
      text-align: center;
      padding: 24px 16px;
    }

    .welcome {
      max-width: 640px;
      width: 100%;
    }

    .icon {
      font-size: clamp(2.5rem, 10vw, 3.5rem);
      margin-bottom: 16px;
    }

    h1 {
      color: var(--gold);
      font-size: clamp(2rem, 9vw, 3.5rem);
      font-weight: 800;
      line-height: 1.3;
    }

    .divider {
      width: 64px;
      height: 3px;
      background: var(--gold);
      border-radius: 2px;
      margin: 20px auto;
      opacity: 0.6;
    }

    p {
      font-size: clamp(1.1rem, 4.5vw, 1.5rem);
      line-height: 1.7;
    }
  </style>
</head>
<body>
  <main class="welcome">
    <div class="icon" aria-hidden="true">☕</div>
    <h1>أهلاً بك في سمراء</h1>
    <div class="divider"></div>
    <p>قهوة مختصة بطابع سعودي</p>
  </main>
</body>
</html>
