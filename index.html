<style>

/* ---------- hero (compact, plays instantly) ---------- */

<script>
/* ============================================================
   سمراء — ربط الموقع بـ Supabase (تسجيل الدخول + قاعدة البيانات)
   يوفّر نفس واجهة claude.use('db') و claude.use('user') اللي يستخدمها الموقع
   ============================================================ */
const SB_URL='https://ddkhtmquslpwsobwfzai.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRka2h0bXF1c2xwd3NvYndmemFpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQyODkzOTIsImV4cCI6MjEwOTg2NTM5Mn0.2mQWRIeYfodHW7ExZpUtFnUYqjxVzOBAF1AyaMBwgYs';
const sb=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true}});
let SESSION=null,MEMBER=null,authResolve;const authReady=new Promise(r=>authResolve=r);

/* ---------- helpers ---------- */
const collOf=p=>p.replace(/\/[^/]+$/,'');
const lastSeg=p=>p.split('/').pop();
function deepMerge(a,b){const o={...(a&&typeof a==='object'&&!Array.isArray(a)?a:{})};
  for(const [k,v] of Object.entries(b||{})){
    if(v&&typeof v==='object'&&!Array.isArray(v)){if(v.__delete__){delete o[k];continue}o[k]=deepMerge(o[k],v)}
    else o[k]=v}
  return o}
const snapDoc=(path,row)=>({id:lastSeg(path),exists:!!row,data:()=>row?JSON.parse(JSON.stringify(row.data)):undefined});
const deny=(msg)=>{const e=new Error(msg||'refused');e.code='invalid_argument';throw e};
let chanSeq=0;

/* ---------- db ---------- */
const DB={
  doc(path){return {
    async get(){const {data,error}=await sb.from('docs').select('path,data').eq('path',path).maybeSingle();if(error)throw error;return snapDoc(path,data)},
    async set(d){const {error}=await sb.from('docs').upsert({path,data:d},{onConflict:'path'});if(error)deny(error.message)},
    async update(patch){const {data:row,error}=await sb.from('docs').select('data').eq('path',path).maybeSingle();if(error)throw error;if(!row)deny('missing');
      const next=deepMerge(row.data,patch);const {data:up,error:e2}=await sb.from('docs').update({data:next}).eq('path',path).select('path');if(e2)deny(e2.message);if(!up||!up.length)deny('refused')},
    async delete(){const {error}=await sb.from('docs').delete().eq('path',path);if(error)deny(error.message)},
    onSnapshot(next,err){let alive=true;const load=async()=>{try{const s=await this.get();if(alive)next(s)}catch(e){if(alive&&err)err(e)}};
      load();const ch=sb.channel('d'+(++chanSeq)).on('postgres_changes',{event:'*',schema:'public',table:'docs',filter:'path=eq.'+path},()=>load()).subscribe();
      return()=>{alive=false;sb.removeChannel(ch)}}
  }},
  collection(c){return {
    onSnapshot(next,err){let alive=true,t=null;const load=async()=>{try{const {data,error}=await sb.from('docs').select('path,data').eq('coll',c);if(error)throw error;if(alive)next({docs:(data||[]).map(r=>snapDoc(r.path,r))})}catch(e){if(alive&&err)err(e)}};
      const later=()=>{clearTimeout(t);t=setTimeout(load,250)};
      load();const ch=sb.channel('c'+(++chanSeq)).on('postgres_changes',{event:'*',schema:'public',table:'docs',filter:'coll=eq.'+c},later).subscribe();
      return()=>{alive=false;clearTimeout(t);sb.removeChannel(ch)}}
  }}
};

/* ---------- user ---------- */
const USER={
  async isOwner(){return MEMBER?.level==='owner'},
  async canEdit(){return MEMBER?.level==='owner'||MEMBER?.level==='admin'},
  async id(){return SESSION?.user?.id||null},
  async me(){return {id:SESSION?.user?.id||null,name:MEMBER?.name||'',email:SESSION?.user?.email||null,isOwner:MEMBER?.level==='owner',canEdit:MEMBER?.level==='owner'||MEMBER?.level==='admin'}},
  async profiles(ids){const out={};if(!ids||!ids.length)return out;const {data}=await sb.from('members').select('uid,name,email').in('uid',ids);(data||[]).forEach(r=>{out[r.uid]={id:r.uid,name:r.name||'',email:r.email||''}});return out}
};
window.claude={use:async n=>{await authReady;if(!SESSION)return null;if(n==='db')return DB;if(n==='user')return USER;return null}};

/* ---------- sign in / sign up screen ---------- */
async function loadMember(){const {data}=await sb.from('members').select('uid,name,email,level').eq('uid',SESSION.user.id).maybeSingle();MEMBER=data||{level:'interact',name:''}}
window.__logout=async()=>{try{await sb.auth.signOut()}catch(e){}location.reload()};
function authScreen(){
  const box=document.getElementById('auth');box.hidden=false;document.getElementById('emp').hidden=true;
  let mode='in';
  const draw=()=>{box.innerHTML=`<div class="authc card stack">
    <img src="${document.querySelector('.logo').src}" alt="سمراء" style="height:80px;margin:0 auto">
    <h2 style="text-align:center">${mode==='in'?'تسجيل الدخول':mode==='up'?'حساب جديد':'نسيت كلمة المرور'}<small class="sub" style="display:block;font-weight:400">${mode==='in'?'Sign in':mode==='up'?'Create account':'Reset password'}</small></h2>
    <label class="lbl">الإيميل · Email<input id="a_email" type="email" dir="ltr" autocomplete="email"></label>
    ${mode!=='reset'?`<label class="lbl">كلمة المرور · Password<input id="a_pass" type="password" dir="ltr" autocomplete="${mode==='up'?'new-password':'current-password'}"></label>`:''}
    <div class="err" id="a_err"></div><div class="sub" id="a_ok" style="color:var(--ok)"></div>
    <button class="btn pri" id="a_go">${mode==='in'?'دخول · Sign in':mode==='up'?'إنشاء الحساب · Create':'أرسل رابط · Send link'}</button>
    ${mode==='in'?`<button class="link" data-m="up">ما عندي حساب — سجّل جديد · New account</button><button class="link" data-m="reset">نسيت كلمة المرور؟ · Forgot password?</button>`:`<button class="link" data-m="in">عندي حساب — دخول · Sign in</button>`}
  </div>`;
  box.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{mode=b.dataset.m;draw()});
  box.querySelector('#a_go').onclick=async()=>{const em=box.querySelector('#a_email').value.trim(),pw=(box.querySelector('#a_pass')||{}).value||'';const er=box.querySelector('#a_err'),ok=box.querySelector('#a_ok');er.textContent='';ok.textContent='';
    if(!/^\S+@\S+\.\S+$/.test(em))return er.textContent='الإيميل غير صحيح · Invalid email';
    if(mode!=='reset'&&pw.length<6)return er.textContent='كلمة المرور 6 أحرف على الأقل · At least 6 characters';
    const b=box.querySelector('#a_go');b.disabled=true;
    try{
      if(mode==='in'){const {error}=await sb.auth.signInWithPassword({email:em,password:pw});if(error)throw error}
      else if(mode==='up'){const {data,error}=await sb.auth.signUp({email:em,password:pw,options:{emailRedirectTo:location.origin+location.pathname}});if(error)throw error;if(!data.session){ok.textContent='انرسل لك إيميل تأكيد — افتحه ثم ارجع وسجّل دخول · Check your email to confirm';b.disabled=false;return}}
      else{const {error}=await sb.auth.resetPasswordForEmail(em,{redirectTo:location.origin+location.pathname});if(error)throw error;ok.textContent='انرسل لك رابط على الإيميل · Link sent';b.disabled=false;return}
    }catch(e){b.disabled=false;const m=String(e.message||e);er.textContent=/Invalid login/i.test(m)?'الإيميل أو كلمة المرور غلط · Wrong email or password':/registered/i.test(m)?'الإيميل مسجّل — سجّل دخول · Already registered':m}
  }};
  draw();
}
function recoveryScreen(){const box=document.getElementById('auth');box.hidden=false;document.getElementById('emp').hidden=true;
  box.innerHTML=`<div class="authc card stack"><img src="${document.querySelector('.logo').src}" alt="سمراء" style="height:80px;margin:0 auto"><h2 style="text-align:center">كلمة مرور جديدة<small class="sub" style="display:block;font-weight:400">New password</small></h2><label class="lbl">كلمة المرور الجديدة · New password<input id="r_pass" type="password" dir="ltr" autocomplete="new-password"></label><div class="err" id="r_err"></div><button class="btn pri" id="r_go">حفظ · Save</button></div>`;
  box.querySelector('#r_go').onclick=async()=>{const pw=box.querySelector('#r_pass').value;if(pw.length<6){box.querySelector('#r_err').textContent='6 أحرف على الأقل · At least 6 characters';return}const {error}=await sb.auth.updateUser({password:pw});if(error){box.querySelector('#r_err').textContent=error.message;return}location.replace(location.origin+location.pathname)}}
async function startAuth(){
  sb.auth.onAuthStateChange((ev)=>{if(ev==='PASSWORD_RECOVERY')setTimeout(recoveryScreen,0)});
  if(/type=recovery/.test(location.hash)){return}
  const {data:{session}}=await sb.auth.getSession();
  if(session){SESSION=session;await loadMember();document.getElementById('auth').hidden=true;document.getElementById('emp').hidden=false;authResolve();return}
  authScreen();
  sb.auth.onAuthStateChange(async(ev,s)=>{if(s&&!SESSION){SESSION=s;await loadMember();document.getElementById('auth').hidden=true;document.getElementById('emp').hidden=false;authResolve()}});
}
startAuth();

</script>

async function migrateSched(){const mt=await db.doc('plan/meta').get(),M=mt.exists?(mt.data()||{}):{};

function sha256js(str){const K=[],H=[];let n=2,c=0;const isP=x=>{for(let i=2;i*i<=x;i++)if(x%i==0)return false;return true};const fr=x=>(x-Math.floor(x))*4294967296|0;while(c<64){if(isP(n)){if(c<8)H[c]=fr(Math.pow(n,1/2));K[c]=fr(Math.pow(n,1/3));c++}n++}

const r=(x,k)=>(x>>>k)|(x<<(32-k));for(let o=0;o<b.length;o+=64){const w=[];for(let i=0;i<16;i++)w[i]=(b[o+i*4]<<24)|(b[o+i*4+1]<<16)|(b[o+i*4+2]<<8)|b[o+i*4+3];for(let i=16;i<64;i++){const s0=r(w[i-15],7)^r(w[i-15],18)^(w[i-15]>>>3),s1=r(w[i-2],17)^r(w[i-2],19)^(w[i-2]>>>10);w[i]=(w[i-16]+s0+w[i-7]+s1)|0}

H[0]=(H[0]+a)|0;H[1]=(H[1]+bb)|0;H[2]=(H[2]+cc)|0;H[3]=(H[3]+d)|0;H[4]=(H[4]+e)|0;H[5]=(H[5]+f)|0;H[6]=(H[6]+g)|0;H[7]=(H[7]+h)|0}

const isOwnerF=()=>ownerFlag;
const ADMIN_NAV=[['المتابعة',[['review','✅','مراجعة القوائم'],['staff','🧑‍🍳','الموظفين اليوم'],['plan','🗓️','التوزيع'],['month','🏆','ملخص الموظفين الشهري'],['reports','📋','التقارير اليومية'],['staffmsg','📢','رسالة اليوم للموظفين'],['vipmsg','📣','معلنين اليوم (السعوديين)'],['sheets','📝','القوائم والمهام']]],['الإدارة',[['m_day','📊','المبيعات واليوم'],['m_month','📈','أداء الشهر'],['m_targets','🎯','الأهداف']]]];
const TITLES={vipmsg:'معلنين اليوم',sheets:'القوائم والمهام',staffmsg:'رسالة اليوم للموظفين',reports:'التقارير اليومية',review:'مراجعة القوائم',staff:'الموظفين اليوم',plan:'التوزيع',month:'ملخص الموظفين الشهري',m_day:'المبيعات واليوم',m_month:'أداء الشهر',m_targets:'الأهداف'};
let view='home';
function setTitle(){const t=$('#tbTitle');if(!t)return;t.textContent=TITLES[view]||({week:t_('weekSched'),home:t_('home'),checklist:t_('myChecklist'),team:t_('team'),me:t_('myDetails')}[view])||''}
function renderDrawer(){
  const p=$('#dpanel'),showAdmin=isAdmin&&db;const who_=meMgr?`<div class="dwho"><b>${esc(meMgr.ar)}</b><small>${esc(meMgr.title)}</small></div>`:(staff&&staff.rid&&rosterById()[staff.rid]?`<div class="dwho"><b>${esc(lang==='ar'?rosterById()[staff.rid].ar:rosterById()[staff.rid].name)}</b></div>`:'');
  const item=(v,ic,l)=>`<button class="ditem ${view===v?'on':''}" data-go="${v}"><span>${ic}</span>${esc(l)}</button>`;
  p.innerHTML=`<div class="dtopp"><img src="${document.querySelector('.logo').src}" alt="سمراء"><button class="dclose" data-go="__close" aria-label="إغلاق">✕</button></div>${who_}
   <div class="dgrp">${item('home','🏠',t_('home'))}${staff&&staff.rid&&!pureMgr()?item('checklist','📝',t_('myChecklist'))+item('team','👥',t_('team')):''}${item('week','📅',t_('weekSched'))}${staff&&!pureMgr()?item('me','👤',t_('myDetails')):''}</div>
   ${showAdmin&&meMgr?ADMIN_NAV.map(([g,items])=>{const its=items.filter(x=>can(x[0]));return its.length?`<div class="dgl">${g}</div><div class="dgrp" dir="rtl">${its.map(x=>item(...x)).join('')}</div>`:''}).join(''):''}
   ${window.__logout?`<div class="dgrp" style="margin-top:10px">${item('__logout','🚪',lang==='ar'||!staff?'تسجيل خروج':(lang==='hi'?'लॉग आउट':lang==='bn'?'লগ আউট':'Log out'))}</div>`:''}
   ${isOwnerF()?`<div class="dgl">صاحب الرابط</div><div class="dgrp" dir="rtl">${item('__gate','🚪','معاينة شاشة الدخول (كأنك شخص جديد)')}</div>`:''}`;
  p.onclick=e=>{const b=e.target.closest('[data-go]');if(!b)return;if(b.dataset.go==='__close')return closeDrawer();go(b.dataset.go)};
}
function openDrawer(){renderDrawer();const d=$('#drawer');document.documentElement.classList.add('noscroll');d.hidden=false;requestAnimationFrame(()=>d.classList.add('on'))}
function closeDrawer(){const d=$('#drawer');d.classList.remove('on');document.documentElement.classList.remove('noscroll');setTimeout(()=>{d.hidden=true},rm?0:260)}
function go(v){closeDrawer();
  if(v==='__pick'){forcePick=true;previewNew=false;ensureMgr(()=>{closeDash();go('home')});return}
  if(v==='__logout'){if(window.__logout)window.__logout();return}
  if(v==='__gate'){previewNew=true;view='home';closeDash();setTitle();showGate();scrollTo(0,0);return}
  previewNew=false;ss.set('samraa_view',v);
  if(!['home','checklist','team','me','week'].includes(v)&&meMgr&&!can(v)){toast('هذا القسم مو ضمن صلاحيتك');v='home'}
  if(v==='home'&&isAdmin&&pureMgr()){v='m_day'}
  if(['checklist','team','me'].includes(v)&&pureMgr())v=meMgr&&can('m_day')?'m_day':'home';
  view=v;
  if(v==='staffmsg'){ensureMgr(openReport);return}
  if(v==='sheets'){ensureMgr(openSheets);return}
  if(v==='vipmsg'){ensureMgr(openVip);return}
  if(v==='week'){openWeek();return}
  if(['home','checklist','team','me'].includes(v)){try{if(location.hash)history.replaceState(null,'',location.pathname+location.search)}catch(e){}
    closeDash();setTitle();
    if(v==='me'){register(true);scrollTo(0,0);return}
    if(staff&&staff.lang&&staff.rid&&!$('#secTasks'))tasks();
    if(!staff&&!meMgr&&v==='home'){showGate();scrollTo(0,0);return}
    if(v==='home'){scrollTo({top:0,behavior:rm?'auto':'smooth'});greet();return}
    const el=$(v==='checklist'?'#secTasks':'#secTeam');if(el)el.scrollIntoView({behavior:rm?'auto':'smooth',block:'start'});return}
  if(v.startsWith('m_')){mtab=v.slice(2);ensureMgr(()=>{if(!can(v)&&meMgr){go('home');return}if(!$('#dash').hidden&&$('#mbody')){renderMgmt();setTitle();scrollTo(0,0);return}closeDash();openMgmt();setTitle()});return}
  dtab=v==='review'?'sheets':v;ensureMgr(()=>{if(!$('#dash').hidden&&dtab!=='mgmt'&&$('#dbody')){renderDash();setTitle();scrollTo(0,0);return}closeDash();openDash();setTitle()});
}
$('#menuBtn').onclick=openDrawer;$('#dback').onclick=closeDrawer;
$('#dback').addEventListener('touchmove',e=>e.preventDefault(),{passive:false});$('#dback').addEventListener('wheel',e=>e.preventDefault(),{passive:false});
addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#drawer').hidden)closeDrawer()});
setTimeout(()=>document.body.classList.add('ready'),2500);
init();
</script>

</body>
</html>
